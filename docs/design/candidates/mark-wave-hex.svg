<!-- R5 candidate mark (U0 usability review, docs/usability.md): a wave inside a hexagon. NOT shipped:
     a candidate for favicon, top bar and report header. Outside the hex-literal scan on purpose
     (literal brand colours from src/lib/brand/tokens.css: navy #001a57, gold #e8c24a, white). One
     file serves both browser themes: on a dark tab strip the ring turns gold so the navy hexagon
     separates from the chrome. Pointy-top hexagon = the brand hex motif's own orientation. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img"
     aria-label="Marine Sensitivity Atlas">
  <title>Marine Sensitivity Atlas</title>
  <style>
    .bg { fill: #001a57; }
    .wave { fill: #e8c24a; }
    .crest { fill: none; stroke: #ffffff; stroke-width: 3.5; stroke-linecap: round; }
    .ring { fill: none; stroke: #001a57; stroke-width: 3.5; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) { .ring { stroke: #e8c24a; } }
  </style>
  <path class="bg" d="M32 3 57.1 17.5v29L32 61 6.9 46.5v-29Z"/>
  <path class="wave" d="M6.9 40c6-7 13-7 19-1s14 7 21 0 8-4 10.2-2.5v10L32 61 6.9 46.5Z"/>
  <path class="crest" d="M10 30.5c5-6 11-6 16.5-1s13 6 19.5-.5 7-3.5 9-2.5"/>
  <path class="ring" d="M32 3 57.1 17.5v29L32 61 6.9 46.5v-29Z"/>
</svg>
