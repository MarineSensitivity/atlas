<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atlas component gallery</title>
    <meta
      name="description"
      content="atlas-3 design-system review surface: every component, every state, both themes."
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!--
      the same pre-paint theme convention the mockups use (docs/design/mockups/*.html): ?theme=
      wins over localStorage, which wins over prefers-color-scheme, falling back to navy
      (spec.md §3) -- so there is no flash and screenshots are reproducible by URL, exactly how
      scripts/mockup-shots.mjs drives the mockups.
    -->
    <script>
      (function () {
        var theme = new URLSearchParams(location.search).get("theme");
        if (theme !== "navy" && theme !== "paper") {
          try {
            theme = localStorage.getItem("atlas.gallery-theme");
          } catch (e) {
            theme = null;
          }
        }
        if (theme !== "navy" && theme !== "paper") {
          theme = matchMedia("(prefers-color-scheme: light)").matches ? "paper" : "navy";
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/gallery/main.ts"></script>
  </body>
</html>
