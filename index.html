    <!--
      early-fetch: kicks off the registry (latest.txt, versions.json) and session.json before the
      app bundle even starts parsing (CalCOFI Explorer's index.html:159-163 pattern,
      atlas-refs/"calcofi explore review.md" §2), then chains {ver}/manifest.json and
      {ver}/app/boot.json off the release this host is allowed to render. Everything lands on
      window.__early as promises; nothing here throws — a missing file (GitHub Pages has no
      session.json; {ver}/app/boot.json does not exist until atlas-1) or a network error is
      swallowed and resolved to a safe default, never left as an unhandled rejection (the Playwright
      smoke spec asserts zero console errors).

      Two rules this script exists to enforce, both security-shaped:

      1. Release files are ABSOLUTE bucket URLs (DATA_BASE below, plan D6's `dataBase()`), never
         same-origin and never relative: the app is mounted at /atlas/ on one host and /{ver}/atlas/
         on the other, so a relative `fetch(ver + "/manifest.json")` both 404s (it produced
         /v9/atlas/v9/manifest.json) and makes the data origin depend on the mount point.
         session.json is the ONE same-origin fetch, by design (plan D6).
      2. The public host renders PUBLIC releases only. A restricted release (v7b/v8/v9 today, per
         versions.json's `access`) is fetched only when the same-origin session says
         `preview: true`; otherwise the request is never made and the app falls through to
         latest.txt's release, recording the denial on window.__early.denied. Unknown version, a row
         with no `access`, or an unreadable versions.json all fail CLOSED.

      This duplicates src/lib/release/{version,session,access,dataBase}.ts on purpose: it must run
      with zero bundle before any `import` is possible. Those modules are the source of truth; this
      copy is driven through the SAME case table by tests/release/inline-early-fetch.test.ts (which

        // …/{ver}/… path without the marine-atlas/ prefix answers 403).

        var latest = fetch(DATA_BASE + "latest.txt", { cache: "no-cache" })
          .then(function (r) {

            return r.text();

            // returning e.g. an error page for a missing latest.txt must not leak into
            // window.__early.version (see src/lib/release/version.ts's isVersionLabel).
            if (!VERSION_RE.test(t)) throw new Error("latest.txt is not a version label");

            })
            .catch(function () {

          version: decision.then(function (d) {
            return d.ver;
          }),
          denied: decision.then(function (d) {
            return d.denied;
          }),
          base: decision.then(function (d) {
            return d.base;
          }),
          versions: versions,
          session: session,
          manifest: releaseJSON("manifest.json"),
          boot: releaseJSON("app/boot.json"),
