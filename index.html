<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Scores · MarineSensitivity Atlas</title>
    <meta name="description" content="Scores, species, places and reports for U.S. marine areas." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

    <!--
      atlas-3 step 3: fonts. The ONE display weight the first frame needs (headlines are never
      lighter than Bold, guide p. 5) is preloaded -- the budget has room (spec.md §12: the display
      face's 2-weight budget is <= 20 KB gzip; this one file is ~10 KB).

      Measured fix (e2e/shell.cls.spec.ts caught it): the body face (Carlito) also needs preloading,
      not just the display face. `font-display: swap` shows the fallback for however long the
      request takes, however short -- fonts.css's metric overrides make that fallback match
      Carlito's OWN box model closely, but not perfectly, on every platform (they are tuned to
      Arial, which is what `sans-serif` resolves to on Windows and Linux/Liberation Sans, but not
      quite what it resolves to on macOS). Preloading both weights wins the race often enough that
      the browser already has Carlito by the time it paints, so the mismatched fallback is never
      actually painted at all -- measured CLS = 0 with this in place, nonzero without it. The
      lens switch's PRESSED state is bold body text (Segmented.svelte, untouched here), which is
      why Bold matters in the first frame too, not just Regular.
    -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="./src/lib/brand/fonts/jost-bold-latin.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="./src/lib/brand/fonts/carlito-regular-latin.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="./src/lib/brand/fonts/carlito-bold-latin.woff2"
      crossorigin
    />

    <!--
      critical CSS, inlined so the shell paints before any JavaScript bundle loads or parses (plan
      atlas-0 Deliverable 2, carried into atlas-3 step 3). `@import` pulls in src/shell/shell.css
      (which itself imports src/lib/brand/tokens.css) -- Vite's html-inline-proxy resolves BOTH
      imports and inlines the resolved CSS text directly into this tag, in dev and in build alike
      (see vite.config.ts's comment on the html/css pipeline). That is the "build step that copies
      [token values] from tokens.css" the review checklist asks for: nobody types a token value by
      hand here, the bundler copies it -- tests/check-inlined-tokens.test.ts proves the copy is
      faithful, and it is proven able to fail with a seeded, mutated fixture.

      shell.css is the SAME file src/shell/Shell.svelte imports for the hydrated app's own layout,
      so the skeleton below and the real shell read identical geometry -- no second, hand-typed
      copy of any size/spacing value to drift between them (the CLS gate,
      e2e/shell.cls.spec.ts, is what actually proves it, at both viewports and both themes).
    -->
    <style>
      @import "./src/shell/shell.css";
    </style>

    <script>
      window.__t0 = performance.now();
    </script>

    <!--
      pre-paint theme script (spec.md §3): sets `data-theme` on <html> before first paint, through
      the SAME rule as src/lib/state/types.ts's `resolveTheme` (dark -> navy, light -> paper,
      "auto"/absent -> prefers-color-scheme, falling back to navy when that signal is unavailable).
      It reads ONLY `location.search` and `matchMedia` and writes ONLY `document.documentElement.
      dataset.theme` -- no localStorage, no fetch, nothing else -- so there is no flash of the wrong
      theme and no other side effect. tests/shell/theme-preboot.test.ts runs this exact script (
      extracted from this file, like tests/release/inline-early-fetch.test.ts does for the early-
      fetch script below) through the same case table `resolveTheme` is tested against, and asserts
      the two never disagree; it also asserts the script touches nothing but that one dataset key.
    -->
    <script>
      (function () {
        var theme;
        var q = new URLSearchParams(location.search).get("theme");
        if (q === "dark") theme = "navy";
        else if (q === "light") theme = "paper";
        else {
          var prefersDark = null;
          try {
            prefersDark = matchMedia("(prefers-color-scheme: dark)").matches;
          } catch (e) {
            prefersDark = null;
          }
          theme = prefersDark === false ? "paper" : "navy";
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>

    <!--
      early-fetch: kicks off the registry (latest.txt, versions.json) and session.json before the
      app bundle even starts parsing (CalCOFI Explorer's index.html:159-163 pattern,
      atlas-refs/"calcofi explore review.md" §2), then chains {ver}/manifest.json and
      {ver}/app/boot.json off the release this host is allowed to render. Everything lands on
      window.__early as promises; nothing here throws — a missing file (GitHub Pages has no
      session.json; {ver}/app/boot.json does not exist until atlas-1) or a network error is
      swallowed and resolved to a safe default, never left as an unhandled rejection (the Playwright
      smoke spec asserts zero console errors).

      Two rules this script exists to enforce, both security-shaped:

      1. Release files are ABSOLUTE bucket URLs (DATA_BASE below, plan D6's `dataBase()`), never
         same-origin and never relative: the app is mounted at /atlas/ on one host and /{ver}/atlas/
         on the other, so a relative `fetch(ver + "/manifest.json")` both 404s (it produced
         /v9/atlas/v9/manifest.json) and makes the data origin depend on the mount point.
         session.json is the ONE same-origin fetch, by design (plan D6).
      2. The public host renders PUBLIC releases only. A restricted release (v7b/v8/v9 today, per
         versions.json's `access`) is fetched only when the same-origin session says
         `preview: true`; otherwise the request is never made and the app falls through to
         latest.txt's release, recording the denial on window.__early.denied. Unknown version, a row
         with no `access`, or an unreadable versions.json all fail CLOSED.

      This duplicates src/lib/release/{version,session,access,dataBase}.ts on purpose: it must run
      with zero bundle before any `import` is possible. Those modules are the source of truth; this
      copy is driven through the SAME case table by tests/release/inline-early-fetch.test.ts (which
      runs this very script in a node:vm sandbox), so the two cannot drift silently.
    -->
    <script>
      (function () {
        var VERSION_RE = /^v[0-9]+[a-z]?$/;
        // derived from VERSION_RE, not a second hardcoded literal — see
        // src/lib/release/version.ts's PATH_VERSION_RE for why (drift).
        var PATH_VERSION_RE = new RegExp("^/(" + VERSION_RE.source.slice(1, -1) + ")/");
        // mirrors PUBLIC_DATA_BASE in src/lib/release/dataBase.ts (path-style S3; the bare
        // …/{ver}/… path without the marine-atlas/ prefix answers 403).
        var DATA_BASE = "https://s3.us-east-1.amazonaws.com/oceanmetrics.io-public/marine-atlas/";

        function versionFromPath(pathname) {
          var m = PATH_VERSION_RE.exec(pathname);
          return m ? m[1] : null;
        }
        function versionFromQuery(search) {
          var v = new URLSearchParams(search).get("ver");
          return v && VERSION_RE.test(v) ? v : null;
        }
        function fetchJSON(url) {
          return fetch(url, { cache: "no-cache" }).then(function (r) {
            if (!r.ok) throw new Error(url + " " + r.status);
            return r.json();
          });
        }

        // --- registry (bucket, starts immediately) ----------------------------------------
        var latest = fetch(DATA_BASE + "latest.txt", { cache: "no-cache" })
          .then(function (r) {
            if (!r.ok) throw new Error("latest.txt " + r.status);
            return r.text();
          })
          .then(function (t) {
            t = t.trim();
            // never stash something that isn't actually a version label — a misconfigured host
            // returning e.g. an error page for a missing latest.txt must not leak into
            // window.__early.version (see src/lib/release/version.ts's isVersionLabel).
            if (!VERSION_RE.test(t)) throw new Error("latest.txt is not a version label");
            return t;
          })
          .catch(function () {
            return null;
          });
        var versions = fetchJSON(DATA_BASE + "versions.json")
          .then(function (rows) {
            return Array.isArray(rows) ? rows : null; // not a list = unreadable, not "empty"
          })
          .catch(function () {
            return null;
          });

        // --- session.json: the one same-origin fetch, and the one door into preview (D6) ----
        // started now, but only AWAITED when a restricted release is in play (below), so the
        // public path never blocks on it. 404 / network error / bad JSON / no preview key = public.
        var session = fetch("session.json", { cache: "no-cache" })
          .then(function (r) {
            if (!r.ok) return { preview: false, raw: null };
            return r
              .json()
              .then(function (body) {
                return {
                  preview: !!(body && typeof body === "object" && body.preview === true),
                  raw: body,
                };
              })
              .catch(function () {
                return { preview: false, raw: null };
              });
          })
          .catch(function () {
            return { preview: false, raw: null };
          });

        // --- the access gate (mirrors src/lib/release/access.ts) ----------------------------
        function accessOf(rows, ver) {
          if (!ver || !Array.isArray(rows)) return "unknown";
          for (var i = 0; i < rows.length; i++) {
            var row = rows[i];
            if (row && typeof row === "object" && row.ver === ver) {
              return row.access === "public" ? "public" : "restricted";
            }
          }
          return "unknown";
        }
        function requiresSession(rows, requested, lat) {
          if (!Array.isArray(rows)) return false; // unreadable: latest.txt only, session irrelevant
          return accessOf(rows, requested) === "restricted" || accessOf(rows, lat) === "restricted";
        }
        // returns null when allowed, else the denial reason
        function check(ver, rows, lat, sess) {
          if (!ver) return "unknown-version";
          if (!Array.isArray(rows)) return ver && ver === lat ? null : "registry-unreadable";
          var a = accessOf(rows, ver);
          if (a === "public") return null;
          if (a === "unknown") return "unknown-version";
          return sess && sess.preview === true ? null : "restricted";
        }
        function decide(requested, lat, rows, sess) {
          var candidate = requested || lat;
          if (!candidate) return { ver: null, denied: null };
          var reason = check(candidate, rows, lat, sess);
          if (!reason) return { ver: candidate, denied: null };
          var denied = { ver: candidate, reason: reason };
          if (lat && lat !== candidate && !check(lat, rows, lat, sess)) {
            return { ver: lat, denied: denied }; // fall through to latest, denial recorded
          }
          return { ver: null, denied: denied };
        }

        // --- dataBase (mirrors src/lib/release/dataBase.ts) ---------------------------------
        function normalizeDataBase(value) {
          if (typeof value !== "string" || !value) return null;
          var url;
          try {
            url = new URL(value);
          } catch (e) {
            return null; // relative or unparseable would mean same-origin: never accepted
          }
          if (url.protocol !== "https:") return null;
          if (url.username || url.password) return null;
          if (url.search || url.hash) return null;
          return url.pathname.slice(-1) === "/" ? url.href : url.href + "/";
        }
        function dataBase(ver, sess) {
          if (!sess || sess.preview !== true) return DATA_BASE;
          var raw = sess.raw;
          if (!raw || typeof raw !== "object") return DATA_BASE;
          var d = raw.data;
          if (typeof d === "string") return normalizeDataBase(d) || DATA_BASE;
          if (d && typeof d === "object" && ver) return normalizeDataBase(d[ver]) || DATA_BASE;
          return DATA_BASE;
        }

        // --- resolve, gate, then (and only then) fetch the release --------------------------
        var requested = versionFromPath(location.pathname) || versionFromQuery(location.search);

        var decision = Promise.all([latest, versions]).then(function (r) {
          var lat = r[0];
          var rows = r[1];
          var gated = requiresSession(rows, requested, lat) ? session : Promise.resolve(null);
          return gated.then(function (sess) {
            var d = decide(requested, lat, rows, sess);
            d.base = dataBase(d.ver, sess);
            return d;
          });
        });

        function releaseJSON(path) {
          return decision
            .then(function (d) {
              return d.ver ? fetchJSON(d.base + d.ver + "/" + path) : null;
            })
            .catch(function () {
              return null; // {ver}/app/boot.json does not exist until atlas-1: a quiet null
            });
        }

        window.__early = {
          version: decision.then(function (d) {
            return d.ver;
          }),
          denied: decision.then(function (d) {
            return d.denied;
          }),
          base: decision.then(function (d) {
            return d.base;
          }),
          versions: versions,
          session: session,
          manifest: releaseJSON("manifest.json"),
          boot: releaseJSON("app/boot.json"),
        };
      })();
    </script>
  </head>
  <body>
    <a class="skip-link" href="#panel-region">Skip to the details panel</a>

    <div id="shell" class="app">
      <header class="topbar" data-tour="topbar">
        <span data-tour="brand" style="display: flex; align-items: center; gap: var(--space-2)">
          <img class="mark mark--navy" src="./src/lib/brand/vendor/mst-mark.svg" alt="" />
          <img class="mark mark--paper" src="./src/lib/brand/vendor/mst-mark-dark.svg" alt="" />
          <h1 class="brand-title" id="app-title">Marine Sensitivity Atlas</h1>
        </span>

        <button
          type="button"
          class="chip"
          id="sk-version-chip"
          data-tour="version-chip"
          data-control="version-chip"
          aria-hidden="true"
          tabindex="-1"
        ></button>

        <div
          class="sk-seg"
          role="group"
          aria-label="Lens"
          data-tour="lens-switch"
          data-control="lens-switch"
          aria-hidden="true"
        >
          <span class="is-pressed">Scores</span>
          <span>Species</span>
        </div>

        <div
          class="search-field topbar-desktop-only"
          data-tour="search"
          data-control="search"
          aria-hidden="true"
        >
          <span class="icon"></span>
          <span>Search species and places</span>
          <span class="kbd">/</span>
        </div>

        <span class="spacer"></span>

        <span id="sk-topbar-actions" aria-hidden="true" style="display: flex; gap: var(--space-1)">
          <span class="tool topbar-desktop-only" data-tour="share" data-control="share">Share</span>
          <span class="tool topbar-desktop-only" data-tour="report-top" data-control="report-top"
            >Report</span
          >
          <span class="tool topbar-desktop-only" data-tour="help" data-control="help"></span>
          <span class="tool" data-tour="theme" data-control="theme"></span>
        </span>
      </header>

      <main class="stage" id="stage">
        <div
          id="map"
          class="map"
          role="img"
          aria-label="Map (loads in a later phase)"
          data-tour="map"
        ></div>

        <nav
          class="rail-region"
          id="rail-region"
          aria-label="Tools"
          data-tour="rail"
          data-control="rail"
        >
          <div class="sk-rail" aria-hidden="true">
            <span class="sk-hexbtn is-pressed"></span>
            <span class="sk-hexbtn"></span>
            <span class="sk-hexbtn"></span>
            <span class="sk-hexbtn"></span>
            <span class="sk-hexbtn"></span>
          </div>
        </nav>

        <div class="panel-region" id="panel-region" data-tour="panel" data-control="panel">
          <div class="sk-panel" aria-hidden="true">
            <div class="sk-panel-grab"></div>
            <div class="sk-panel-head">
              <p class="sk-panel-title">Layers</p>
              <div class="sk-panel-controls">
                <span class="sk-panel-ctrl"></span>
                <span class="sk-panel-ctrl"></span>
                <span class="sk-panel-ctrl"></span>
              </div>
            </div>
            <div class="sk-panel-body">
              Layers, palette and outline options arrive in a later phase.
            </div>
          </div>
        </div>

        <div class="about-region" id="about-region" data-tour="about" data-control="about">
          <div class="sk-about" aria-hidden="true">
            <div class="sk-about-head">
              <span class="icon"></span>
              <h2>About this release</h2>
              <span class="sk-about-tool"></span>
            </div>
          </div>
        </div>
      </main>
    </div>

    <noscript>
      This app needs JavaScript to render the map, scores and species. Please enable it.
    </noscript>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
