<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MarineSensitivity Atlas</title>
    <meta name="description" content="Scores, species, places and reports for U.S. marine areas." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!--
      critical CSS, inlined so the shell paints before any JavaScript bundle loads or parses
      (plan atlas-0 Deliverable 2). Real design tokens arrive in atlas-3; for now this uses the
      four MMA hex values directly (ground truth: Gold #E8C24A, Steel #173D6D, Navy #001A57,
      Crimson #6E110F).
    -->
    <style>
      :root {
        --mma-gold: #e8c24a;
        --mma-steel: #173d6d;
        --mma-navy: #001a57;
        --mma-crimson: #6e110f;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        color: #101820;
        background: #fff;
      }
      #shell {
        display: grid;
        grid-template-columns: 64px 1fr;
        grid-template-rows: 56px 1fr;
        grid-template-areas: "topbar topbar" "rail main";
        height: 100vh;
        min-height: 100%;
      }
      .ms-topbar {
        grid-area: topbar;
        background: var(--mma-navy);
        color: var(--mma-gold);
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0 1rem;
        font-weight: 600;
      }
      .ms-topbar .ms-title {
        white-space: nowrap;
      }
      #version-badge {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .ms-version {
        font-weight: 400;
        opacity: 0.85;
      }
      .ms-preview-badge {
        background: var(--mma-crimson);
        color: #fff;
        font-size: 0.7rem;
        letter-spacing: 0.05em;
        padding: 0.2rem 0.5rem;
        border-radius: 3px;
      }
      .ms-rail {
        grid-area: rail;
        background: var(--mma-steel);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.5rem;
        padding-top: 0.75rem;
      }
      .ms-rail button {
        width: 44px;
        height: 44px;
        border: none;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.08);
        color: var(--mma-gold);
        font-size: 0.65rem;
        cursor: pointer;
      }
      .ms-rail button:hover,
      .ms-rail button:focus-visible {
        background: rgba(255, 255, 255, 0.2);
      }
      #main {
        grid-area: main;
        position: relative;
        display: grid;
        grid-template-columns: minmax(280px, 360px) 1fr;
        min-width: 0;
      }
      #panel {
        overflow: auto;
        border-right: 1px solid #d8dde3;
        padding: 1rem;
        min-width: 0;
      }
      .ms-skel {
        background: #e5e7eb;
        border-radius: 4px;
        height: 1rem;
        margin-bottom: 0.6rem;
      }
      .ms-skel.short {
        width: 60%;
      }
      #map {
        background: #cfe3f7;
        min-width: 0;
      }
      @media (max-width: 480px) {
        #shell {
          grid-template-columns: 1fr;
          grid-template-rows: 56px auto 1fr;
          grid-template-areas: "topbar" "rail" "main";
        }
        .ms-rail {
          flex-direction: row;
          padding: 0.5rem;
        }
        #main {
          grid-template-columns: 1fr;
          grid-template-rows: auto minmax(200px, 1fr);
        }
        #panel {
          border-right: none;
          border-bottom: 1px solid #d8dde3;
        }
      }
    </style>
    <script>
      window.__t0 = performance.now();
    </script>
    <!--
      early-fetch: kicks off the registry (latest.txt, versions.json) and session.json before the
      app bundle even starts parsing (CalCOFI Explorer's index.html:159-163 pattern,
      atlas-refs/"calcofi explore review.md" §2), then chains {ver}/manifest.json and
      {ver}/app/boot.json off the release this host is allowed to render. Everything lands on
      window.__early as promises; nothing here throws — a missing file (GitHub Pages has no
      session.json; {ver}/app/boot.json does not exist until atlas-1) or a network error is
      swallowed and resolved to a safe default, never left as an unhandled rejection (the Playwright
      smoke spec asserts zero console errors).

      Two rules this script exists to enforce, both security-shaped:

      1. Release files are ABSOLUTE bucket URLs (DATA_BASE below, plan D6's `dataBase()`), never
         same-origin and never relative: the app is mounted at /atlas/ on one host and /{ver}/atlas/
         on the other, so a relative `fetch(ver + "/manifest.json")` both 404s (it produced
         /v9/atlas/v9/manifest.json) and makes the data origin depend on the mount point.
         session.json is the ONE same-origin fetch, by design (plan D6).
      2. The public host renders PUBLIC releases only. A restricted release (v7b/v8/v9 today, per
         versions.json's `access`) is fetched only when the same-origin session says
         `preview: true`; otherwise the request is never made and the app falls through to
         latest.txt's release, recording the denial on window.__early.denied. Unknown version, a row
         with no `access`, or an unreadable versions.json all fail CLOSED.

      This duplicates src/lib/release/{version,session,access,dataBase}.ts on purpose: it must run
      with zero bundle before any `import` is possible. Those modules are the source of truth; this
      copy is driven through the SAME case table by tests/release/inline-early-fetch.test.ts (which
      runs this very script in a node:vm sandbox), so the two cannot drift silently.
    -->
    <script>
      (function () {
        var VERSION_RE = /^v[0-9]+[a-z]?$/;
        // derived from VERSION_RE, not a second hardcoded literal — see
        // src/lib/release/version.ts's PATH_VERSION_RE for why (drift).
        var PATH_VERSION_RE = new RegExp("^/(" + VERSION_RE.source.slice(1, -1) + ")/");
        // mirrors PUBLIC_DATA_BASE in src/lib/release/dataBase.ts (path-style S3; the bare
        // …/{ver}/… path without the marine-atlas/ prefix answers 403).
        var DATA_BASE = "https://s3.us-east-1.amazonaws.com/oceanmetrics.io-public/marine-atlas/";

        function versionFromPath(pathname) {
          var m = PATH_VERSION_RE.exec(pathname);
          return m ? m[1] : null;
        }
        function versionFromQuery(search) {
          var v = new URLSearchParams(search).get("ver");
          return v && VERSION_RE.test(v) ? v : null;
        }
        function fetchJSON(url) {
          return fetch(url, { cache: "no-cache" }).then(function (r) {
            if (!r.ok) throw new Error(url + " " + r.status);
            return r.json();
          });
        }

        // --- registry (bucket, starts immediately) ----------------------------------------
        var latest = fetch(DATA_BASE + "latest.txt", { cache: "no-cache" })
          .then(function (r) {
            if (!r.ok) throw new Error("latest.txt " + r.status);
            return r.text();
          })
          .then(function (t) {
            t = t.trim();
            // never stash something that isn't actually a version label — a misconfigured host
            // returning e.g. an error page for a missing latest.txt must not leak into
            // window.__early.version (see src/lib/release/version.ts's isVersionLabel).
            if (!VERSION_RE.test(t)) throw new Error("latest.txt is not a version label");
            return t;
          })
          .catch(function () {
            return null;
          });
        var versions = fetchJSON(DATA_BASE + "versions.json")
          .then(function (rows) {
            return Array.isArray(rows) ? rows : null; // not a list = unreadable, not "empty"
          })
          .catch(function () {
            return null;
          });

        // --- session.json: the one same-origin fetch, and the one door into preview (D6) ----
        // started now, but only AWAITED when a restricted release is in play (below), so the
        // public path never blocks on it. 404 / network error / bad JSON / no preview key = public.
        var session = fetch("session.json", { cache: "no-cache" })
          .then(function (r) {
            if (!r.ok) return { preview: false, raw: null };
            return r
              .json()
              .then(function (body) {
                return {
                  preview: !!(body && typeof body === "object" && body.preview === true),
                  raw: body,
                };
              })
              .catch(function () {
                return { preview: false, raw: null };
              });
          })
          .catch(function () {
            return { preview: false, raw: null };
          });

        // --- the access gate (mirrors src/lib/release/access.ts) ----------------------------
        function accessOf(rows, ver) {
          if (!ver || !Array.isArray(rows)) return "unknown";
          for (var i = 0; i < rows.length; i++) {
            var row = rows[i];
            if (row && typeof row === "object" && row.ver === ver) {
              return row.access === "public" ? "public" : "restricted";
            }
          }
          return "unknown";
        }
        function requiresSession(rows, requested, lat) {
          if (!Array.isArray(rows)) return false; // unreadable: latest.txt only, session irrelevant
          return accessOf(rows, requested) === "restricted" || accessOf(rows, lat) === "restricted";
        }
        // returns null when allowed, else the denial reason
        function check(ver, rows, lat, sess) {
          if (!ver) return "unknown-version";
          if (!Array.isArray(rows)) return ver && ver === lat ? null : "registry-unreadable";
          var a = accessOf(rows, ver);
          if (a === "public") return null;
          if (a === "unknown") return "unknown-version";
          return sess && sess.preview === true ? null : "restricted";
        }
        function decide(requested, lat, rows, sess) {
          var candidate = requested || lat;
          if (!candidate) return { ver: null, denied: null };
          var reason = check(candidate, rows, lat, sess);
          if (!reason) return { ver: candidate, denied: null };
          var denied = { ver: candidate, reason: reason };
          if (lat && lat !== candidate && !check(lat, rows, lat, sess)) {
            return { ver: lat, denied: denied }; // fall through to latest, denial recorded
          }
          return { ver: null, denied: denied };
        }

        // --- dataBase (mirrors src/lib/release/dataBase.ts) ---------------------------------
        function normalizeDataBase(value) {
          if (typeof value !== "string" || !value) return null;
          var url;
          try {
            url = new URL(value);
          } catch (e) {
            return null; // relative or unparseable would mean same-origin: never accepted
          }
          if (url.protocol !== "https:") return null;
          if (url.username || url.password) return null;
          if (url.search || url.hash) return null;
          return url.pathname.slice(-1) === "/" ? url.href : url.href + "/";
        }
        function dataBase(ver, sess) {
          if (!sess || sess.preview !== true) return DATA_BASE;
          var raw = sess.raw;
          if (!raw || typeof raw !== "object") return DATA_BASE;
          var d = raw.data;
          if (typeof d === "string") return normalizeDataBase(d) || DATA_BASE;
          if (d && typeof d === "object" && ver) return normalizeDataBase(d[ver]) || DATA_BASE;
          return DATA_BASE;
        }

        // --- resolve, gate, then (and only then) fetch the release --------------------------
        var requested = versionFromPath(location.pathname) || versionFromQuery(location.search);

        var decision = Promise.all([latest, versions]).then(function (r) {
          var lat = r[0];
          var rows = r[1];
          var gated = requiresSession(rows, requested, lat) ? session : Promise.resolve(null);
          return gated.then(function (sess) {
            var d = decide(requested, lat, rows, sess);
            d.base = dataBase(d.ver, sess);
            return d;
          });
        });

        function releaseJSON(path) {
          return decision
            .then(function (d) {
              return d.ver ? fetchJSON(d.base + d.ver + "/" + path) : null;
            })
            .catch(function () {
              return null; // {ver}/app/boot.json does not exist until atlas-1: a quiet null
            });
        }

        window.__early = {
          version: decision.then(function (d) {
            return d.ver;
          }),
          denied: decision.then(function (d) {
            return d.denied;
          }),
          base: decision.then(function (d) {
            return d.base;
          }),
          versions: versions,
          session: session,
          manifest: releaseJSON("manifest.json"),
          boot: releaseJSON("app/boot.json"),
        };
      })();
    </script>
  </head>
  <body>
    <div id="shell">
      <header class="ms-topbar">
        <span class="ms-title">MarineSensitivity Atlas</span>
        <span id="version-badge"></span>
      </header>
      <nav class="ms-rail" aria-label="tools">
        <button type="button" data-control="lens-scores" aria-label="Scores" disabled>
          Scores
        </button>
        <button type="button" data-control="lens-species" aria-label="Species" disabled>
          Species
        </button>
        <button type="button" data-control="lens-places" aria-label="Places" disabled>
          Places
        </button>
        <button type="button" data-control="lens-report" aria-label="Report" disabled>
          Report
        </button>
      </nav>
      <main id="main">
        <section id="panel" aria-label="details panel">
          <div class="ms-skel" aria-hidden="true"></div>
          <div class="ms-skel" aria-hidden="true"></div>
          <div class="ms-skel short" aria-hidden="true"></div>
        </section>
        <div id="map" role="img" aria-label="map (not yet loaded)"></div>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
