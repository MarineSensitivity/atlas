    <!--
      early-fetch: kicks off latest.txt, versions.json and session.json before the app bundle even
      starts parsing (CalCOFI Explorer's index.html:159-163 pattern, atlas-refs/"calcofi explore
      review.md" §2), then chains {ver}/manifest.json and {ver}/app/boot.json off the resolved
      version. Everything lands on window.__early as promises; nothing here throws — a missing file
      (GitHub Pages has no session.json) or a network error is swallowed and resolved to a safe
      default, never left as an unhandled rejection (the Playwright smoke spec asserts zero console
      errors).

      This duplicates the logic of src/lib/release/version.ts and src/lib/release/session.ts on
      purpose: it must run with zero bundle before any `import` is possible, so it cannot pull in the
      real module. Those two modules are the source of truth and carry the unit tests (path beats
      query beats latest.txt; `^v[0-9]+[a-z]?$`; 404/network-error = public, only a 200 with
      `preview: true` = preview) — keep this copy in sync with them by hand.
    -->
    <script>
      (function () {
        var VERSION_RE = /^v[0-9]+[a-z]?$/;
        // derived from VERSION_RE, not a second hardcoded literal — see
        // src/lib/release/version.ts's PATH_VERSION_RE for why (drift).
        var PATH_VERSION_RE = new RegExp("^/(" + VERSION_RE.source.slice(1, -1) + ")/");

        function versionFromPath(pathname) {
          var m = PATH_VERSION_RE.exec(pathname);
          return m ? m[1] : null;
        }
        function versionFromQuery(search) {
          var v = new URLSearchParams(search).get("ver");
          return v && VERSION_RE.test(v) ? v : null;
        }
        function fetchLatest() {
          return fetch("latest.txt", { cache: "no-cache" })
            .then(function (r) {
              if (!r.ok) throw new Error("latest.txt " + r.status);
              return r.text();
            })
            .then(function (t) {
              t = t.trim();
              // never stash something that isn't actually a version label — a misconfigured host
              // returning e.g. its own index.html for a missing latest.txt must not leak into
              // window.__early.version (see src/lib/release/version.ts's isVersionLabel).
              if (!VERSION_RE.test(t)) throw new Error("latest.txt is not a version label");
              return t;
            });
        }
        function fetchJSON(url) {
          return fetch(url, { cache: "no-cache" }).then(function (r) {
            if (!r.ok) throw new Error(url + " " + r.status);
            return r.json();
          });
        }
        function fetchSession() {
          // same-origin; a 404 (public GitHub Pages: this file never exists) and a network error
          // both resolve to "public" (plan D6) rather than rejecting. Always normalizes to
          // { preview: boolean } — never passes the raw parsed body through — so this can't
          // silently drift from src/lib/release/session.ts's SessionInfo shape (a body of `{}`,
          // with no `preview` key, must resolve the same way as an explicit `preview: false`).
          return fetch("session.json", { cache: "no-cache" })
            .then(function (r) {
              if (!r.ok) return { preview: false };
              return r
                .json()
                .then(function (body) {
                  return { preview: !!(body && typeof body === "object" && body.preview === true) };
                })
                .catch(function () {
                  return { preview: false };
                });
            })
            .catch(function () {
              return { preview: false };
            });
        }

        var fromPath = versionFromPath(location.pathname);
        var fromQuery = fromPath ? null : versionFromQuery(location.search);
        var version = fromPath
          ? Promise.resolve(fromPath)
          : fromQuery
            ? Promise.resolve(fromQuery)
            : fetchLatest().catch(function () {
                return null;
              });

        var versions = fetchJSON("versions.json").catch(function () {
          return null;
        });
        var session = fetchSession();
        var manifest = version
          .then(function (v) {
            return v ? fetchJSON(v + "/manifest.json") : null;
          })
          .catch(function () {
            return null;
          });
        var boot = version
          .then(function (v) {
            return v ? fetchJSON(v + "/app/boot.json") : null;
          })
          .catch(function () {
            return null;
          });

        window.__early = {
          version: version,
          versions: versions,
          session: session,
          manifest: manifest,
          boot: boot,
