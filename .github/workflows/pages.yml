name: Pages

# The MarineSensitivity Atlas, built from oceanmetrics/atlas at the tag in PIN (instance
# marinesensitivity) by that repository's ONE reusable build, and published to this repository's
# gh-pages (branch-based Pages, served at https://marinesensitivity.org/atlas/; the preview host's
# sidecar serves the same branch at https://preview.marinesensitivity.org/{ver}/atlas/). To move the
# site to a new oceanmetrics/atlas release, change the tag in PIN and in the two places in the
# `pages` job below (the `uses:` suffix and the `ref` input), in one commit.
#
# Only a push to main (or a dispatch from main) publishes; a pull request builds and checks the same
# tag without publishing, so a PR that moves the pin shows green or red before it is merged.
on:
  push:
    branches: [main]
    # the feedback Apps Script commits each report's screenshot to main under feedback/; that commit
    # changes nothing the build reads
    paths-ignore:
      - "feedback/**"
      - "**.md"
  pull_request:
    paths-ignore:
      - "feedback/**"
      - "**.md"
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pin:
    name: the pin agrees (PIN, uses, ref) and the variables are set
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: PIN, the uses suffix and the ref input name one tag
        run: |
          pin="$(tr -d '[:space:]' < PIN)"
          esc="${pin//./\\.}"
          grep -Eq "^ +uses: oceanmetrics/atlas/\.github/workflows/build-instance\.yml@${esc}\$" .github/workflows/pages.yml \
            || { echo "::error title=pin mismatch::PIN says ${pin} but the uses: line in pages.yml does not end in @${pin}"; exit 1; }
          grep -Eq "^ +ref: ${esc}\$" .github/workflows/pages.yml \
            || { echo "::error title=pin mismatch::PIN says ${pin} but the ref input in pages.yml is not ${pin}"; exit 1; }
          echo "building oceanmetrics/atlas@${pin}"

      # 0.10.93 hard-coded the GA4 id in analytics.ts; oceanmetrics/atlas ships none, so an unset
      # variable would silently publish a site with no analytics
      - name: the repository variable VITE_GA_ID is set
        env:
          GA_ID: ${{ vars.VITE_GA_ID }}
        run: |
          if [ -z "$GA_ID" ]; then
            echo "::error title=VITE_GA_ID is unset::set the repository variable VITE_GA_ID=G-9HW6L751XG (Settings -> Secrets and variables -> Actions -> Variables), then re-run this workflow"
            exit 1
          fi
          if ! printf '%s' "$GA_ID" | grep -Eq '^G-[A-Z0-9]+$'; then
            echo "::error title=VITE_GA_ID is malformed::VITE_GA_ID is '${GA_ID}', expected a GA4 measurement id such as G-9HW6L751XG"
            exit 1
          fi
          echo "VITE_GA_ID=${GA_ID}"

  pages:
    needs: [pin]
    permissions:
      contents: write # the called workflow's deploy job pushes gh-pages with this repo's GITHUB_TOKEN
    uses: oceanmetrics/atlas/.github/workflows/build-instance.yml@v0.5.0
    with:
      instance: marinesensitivity
      ref: v0.5.0
      # publish only from main (a push or a dispatch); a pull request or another branch builds and
      # checks only
      deploy: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      publish-branch: gh-pages
      # this repository's variables (Settings -> Secrets and variables -> Actions -> Variables),
      # public values that ship in the bundle either way
      VITE_FEEDBACK_URL: ${{ vars.VITE_FEEDBACK_URL }}
      VITE_LOG_URL: ${{ vars.VITE_LOG_URL }}
      VITE_GA_ID: ${{ vars.VITE_GA_ID }}
      VITE_PREVIEW_ATLAS_ROUTE: ${{ vars.VITE_PREVIEW_ATLAS_ROUTE }}
      # the MMA seal (instance.json `seal`: agency MMA and its image), shown only on this build
      VITE_SEAL: "1"
