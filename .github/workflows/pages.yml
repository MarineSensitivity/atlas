name: Pages

# atlas-0 Deliverable 3. Checks run on every push (any branch) and every pull request; only a push
# to `main` goes on to publish `dist/` — as the SAME artifact the checks job just built, never a
# second `vite build` — to the `gh-pages` branch (branch-based Pages, not the artifact-deploy
# action: the preview host's sidecar pulls this same branch in atlas-9, so both hosts serve one
# commit). `concurrency: pages` + cancel-in-progress so a stale run never wins a race to publish.
on:
  push:
  pull_request:

concurrency:
  group: pages
  cancel-in-progress: true

# least privilege by default; the publish job below is the only place this is escalated.
permissions:
  contents: read

jobs:
  checks:
    name: build & checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx tsc --noEmit

      - run: npx vitest run

      - run: npx vite build

      # atlas-0 Deliverable 4: fails on a >350 KB gzip critical path, or a lazy-only chunk
      # (duckdb*/terra-draw*/docx*/shp*/treemap) reachable by static import.
      - run: node scripts/size-budget.mjs

      # atlas-0 Deliverable 3 / plan D6: dist/ must never contain session.json — that file only
      # ever exists on the preview host, and its presence is the sole switch into preview mode.
      - run: node scripts/check-dist-session.mjs dist

      # plan D2: base: "./" must produce relative asset URLs only, so the same dist/ runs under
      # both /atlas/ and /v9/atlas/.
      - run: node scripts/check-relative-assets.mjs dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  publish:
    name: publish dist/ to gh-pages
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # only this job needs to push; the default above stays read-only
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
