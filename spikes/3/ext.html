<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>atlas S3 spike: duckdb-wasm extension autoload</title>
  </head>
  <body>
    <!-- measurement harness only, driven by Playwright via window.__ext (src/ext-check.ts) -->

    <script type="module" src="/src/ext-check.ts"></script>

      window.addEventListener("DOMContentLoaded", () => {
        document.getElementById("status").textContent = "ready";
      });
    </script>
  </body>
